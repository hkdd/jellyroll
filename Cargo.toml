[workspace]
resolver = "3"
members = ["crates/platform", "crates/render", "crates/video", "crates/jellyfin-api", "crates/mock-server", "crates/app"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
