[package]
name = "jellyroll-mock-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Mock Jellyfin server for development and CI (spec 13)"

[[bin]]
name = "jellyroll-mock"
path = "src/main.rs"

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.2", features = ["rt", "net", "io-util", "macros", "time"] }
