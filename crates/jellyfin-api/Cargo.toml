[package]
name = "jellyroll-jellyfin-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tracing = "=0.1.44"
# The server's WebSocket (spec 8): framing only; the HTTP upgrade and TLS
# go through reqwest.
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
tokio = { version = "=1.53.2", features = ["time"] }

[dev-dependencies]
tokio = { version = "=1.53.2", features = ["rt", "macros", "net", "io-util"] }
