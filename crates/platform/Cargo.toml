[package]
name = "jellyroll-platform"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
sdl3 = "=0.20.0"
tracing = "=0.1.44"

[features]
# Build and statically link the SDL3 version pinned by sdl3-sys instead of
# using the system library (for CI and distros without SDL3).
build-sdl = ["sdl3/build-from-source-static", "sdl3/build-from-source-unix-console"]
