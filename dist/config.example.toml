# Jellyroll configuration: ~/.config/jellyroll/config.toml
#
# Every key is optional; anything left out uses the default shown here.
# Unknown keys and out-of-range values are reported (journalctl -t jellyroll
# and on screen) and ignored. Command-line flags override this file.
# The app only reads this file; it never rewrites it.

[log]
# RUST_LOG syntax: "info", "debug", or "target=level,...".
# The RUST_LOG environment variable takes precedence.
level = "info"

[server]
# Jellyfin server address. Empty: the last server you signed in to, else
# the first one found on the local network.
url = ""
# PEM file with an extra CA certificate, or your server's self-signed
# certificate, for https. Empty: the system's trusted roots only.
ca_file = ""

[display]
# Fraction of each screen edge kept clear for TV overscan (0.0 - 0.1).
safe_area = 0.025
# Double instead of triple buffering. Lower latency, higher risk of missed
# frames; see docs/DECISIONS.md (D10).
double_buffer = false
# Resolution the interface is drawn at; video always plays at full
# resolution. "native": the display's own resolution (sharpest; on weak
# GPUs at 4K, frames that load new artwork take longer), "1080p": drawn at
# 1080p and upscaled (smoother on weak GPUs), "auto": 1080p on displays
# above 1080p. The Settings page can change this, and its choice wins over
# this file.
ui_resolution = "native"
# Switch the TV to the video's frame rate while it plays (23.976 fps at
# 23.976 or 24 Hz, 25 at 50 Hz, 29.97 at 59.94 Hz) and back afterwards.
# Settings can turn it off for each output resolution.
match_refresh = true
# Some TVs take a second or two to show a new mode; wait this long after
# switching before playback starts so the beginning isn't missed (0-10000).
refresh_switch_delay_ms = 0

# Minutes without input before the screensaver starts (while browsing or
# with a video paused); 0 = off. Settings offers off, 5, 10 or 15.
screensaver_minutes = 10

[audio]
# Audio output, as mpv names it: "auto", "pipewire", "alsa/hdmi:CARD=PCH,DEV=0"...
# `jellyroll --print-diagnostics` lists them. Settings can change this.
device = "auto"
# Send Dolby/DTS audio to the receiver undecoded (bitstream). Only for a
# receiver or TV that decodes them; Settings sets it per output.
passthrough = false
# Formats sent undecoded when passthrough is on ("dts-hd" covers DTS).
passthrough_codecs = "ac3,eac3,dts-hd,truehd"
# Channels for decoded audio: "auto" (what the device reports), "stereo",
# "5.1", "7.1".
channels = "auto"

[playback]
# Settings can change each of these.
# Motion smoothing (mpv interpolation): blends frames when the TV can't run
# at the video's frame rate. Off by default.
interpolation = false
# "auto" (only videos the server reports as interlaced), "always", "off".
deinterlace = "auto"
# HDR to SDR tone mapping: "auto", "bt.2390", "spline", "hable", "mobius",
# "reinhard", "clip".
tone_mapping = "auto"

[input]
# HDMI-CEC: control jellyroll with the TV remote (needs a CEC-capable GPU
# port or a USB adapter such as Pulse-Eight; see README).
cec = true
# Turn the TV on and switch it to this input when jellyroll starts.
cec_wake_tv = true
# A specific device such as "/dev/cec0"; empty picks the first available.
cec_device = ""
# Key repeat for held buttons (keyboard, gamepad and remote alike).
repeat_delay_ms = 350
repeat_interval_ms = 80
# After holding this long, repeats speed up to repeat_fast_interval_ms.
repeat_accelerate_after_ms = 1500
repeat_fast_interval_ms = 40

[cache]
# Disk space for downloaded artwork (~/.cache/jellyroll/images).
images_mb = 2048
# GPU memory for artwork textures; least recently shown are dropped first.
textures_mb = 512

[debug]
# Show the perf HUD at startup (F3 toggles).
hud = false
# Let Back on a top-level screen (e.g. a problem screen) quit the app;
# always on with --dev. "Exit to console" in the power menu is always there.
allow_exit = false
